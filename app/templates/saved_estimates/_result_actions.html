{% if saved_estimates_enabled %}
  <div class="estimate-action-buttons">
    <button id="save_estimate" type="button" class="estimate-action" disabled>
      Save 
    </button>
    <button id="print_estimate" type="button" class="estimate-action" disabled>
      Saved quotations
    </button>
    <button id="new_calculation" type="button" class="estimate-action">New calculation</button>
  </div>
  <span id="estimate_action_status" class="estimate-action-status" aria-live="polite"></span>
{% endif %}
