<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — Freight Calculator</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
<main class="page login-page">
  <section class="card login-card">
    <h1>Freight Calculator</h1>
    <p class="muted">Sign in with your authorized user account.</p>
    {% if form.errors %}
      <div class="error">The email/username or password is incorrect.</div>
    {% endif %}
    {% if next and user.is_authenticated %}
      <div class="error">Your account does not have access to that page.</div>
    {% endif %}
    <form method="post" action="{% url 'login' %}">
      {% csrf_token %}
      <label>Email or username
        <input type="text" name="username" autocomplete="username" autofocus required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <input type="hidden" name="next" value="{{ next }}">
      <button class="primary" type="submit">Sign in</button>
    </form>
  </section>
</main>
</body>
</html>
