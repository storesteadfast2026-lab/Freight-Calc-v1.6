{% extends "admin/base_site.html" %}

{% block content %}
  <div id="content-main">
    <p>Django will download the fuel CSV from:</p>
    <p><code>{{ source_url }}</code></p>
    <p>The file will be stored, audited and validated. Fuel rates are not changed until you activate the validated file.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {{ form.as_p }}
      <div class="submit-row">
        <input type="submit" value="Fetch and validate" class="default">
        <a href="{% url 'admin:imports_externaldatafile_changelist' %}" class="button cancel-link">Cancel</a>
      </div>
    </form>
  </div>
{% endblock %}
